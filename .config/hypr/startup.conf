# exec-once = hyprpm reload
# exec-once = hyprlock || hyprctl dispatch exit
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DISPLAY HYPRLAND_INSTANCE_SIGNATURE
exec-once = vicinae server
exec-once = hyprpaper
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = kb-writelayer 4d44 5244
exec-once = systemctl --user start xdg-desktop-portal xdg-desktop-portal-hyprland
# exec-once = hyprctl dispatch exec '[workspace 30 silent] zen-browser'
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

env = QT_QPA_PLATFORMTHEME,qt6ct
