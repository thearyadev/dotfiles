# ──────────────────────────────────────────────
#  Layout
# ──────────────────────────────────────────────

general {
    gaps_in = 3
    gaps_out = 8

    border_size = 2

    col.active_border = rgba(ee99a0ff) rgba(c6a0f6ff) 45deg
    col.inactive_border = rgba(363a4f80)

    resize_on_border = true

    allow_tearing = true

    layout = scrolling
}

master {
    new_status = master
    orientation = right
}

scrolling {
    column_width = 0.5
    fullscreen_on_one_column = true
    focus_fit_method = 1
}

# ──────────────────────────────────────────────
#  Decoration
# ──────────────────────────────────────────────

decoration {
    rounding = 14
    rounding_power = 3

    active_opacity = 0.96
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 20
        render_power = 3
        offset = 0, 4
        color = rgba(0a0a1444)
        color_inactive = rgba(0a0a1422)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        contrast = 0.9
        brightness = 0.85
        vibrancy = 0.2
        vibrancy_darkness = 0.3
        new_optimizations = true
    }
}

# ──────────────────────────────────────────────
#  Animations
# ──────────────────────────────────────────────

animations {
    enabled = yes

    # snappy ease-out
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    # gentle deceleration
    bezier = gentle, 0.25, 1.0, 0.5, 1.0
    # fast in-out for fades
    bezier = fadeCurve, 0.4, 0.0, 0.2, 1.0
    # linear
    bezier = linear, 0, 0, 1, 1

    animation = global, 1, 4, gentle
    animation = border, 1, 3, snappy
    animation = borderangle, 1, 40, linear, loop
    animation = windows, 1, 4, snappy, popin 80%
    animation = windowsIn, 1, 4, snappy, popin 80%
    animation = windowsOut, 1, 3, fadeCurve, popin 70%
    animation = fadeIn, 1, 3, fadeCurve
    animation = fadeOut, 1, 3, fadeCurve
    animation = fade, 1, 3, fadeCurve
    animation = layers, 1, 3, snappy, fade
    animation = layersIn, 1, 3, snappy, fade
    animation = layersOut, 1, 2, fadeCurve, fade
    animation = fadeLayersIn, 1, 2, fadeCurve
    animation = fadeLayersOut, 1, 2, fadeCurve
    animation = workspaces, 1, 3, snappy, slide
    animation = workspacesIn, 1, 3, snappy, slide
    animation = workspacesOut, 1, 3, fadeCurve, slide
}

# ──────────────────────────────────────────────
#  Misc
# ──────────────────────────────────────────────

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}
